<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório VPN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: figura de apoio à demo ao vivo — passo e comandos no topo, topologia grande, resultado e pacote embaixo */
:root {
  --bg: #f1f3f6; --surface: #ffffff; --ink: #16202b; --muted: #5a6677; --line: #d5dce5;
  --orig: #0d7f74; --orig-soft: #dcf1ee;
  --enc: #b55e0c; --enc-soft: #fbe9d6;
  --bad: #c03535; --bad-soft: #f9e1e1;
  --cmd-bg: #18202b; --cmd-ink: #e6ecf2; --cmd-prompt: #f0a04b; --cmd-muted: #8c9aab;
  --z-casa: #e2ecfb; --z-casa-ink: #2c5ca8;
  --z-net: #eceef2; --z-net-ink: #4f5b6b;
  --z-emp: #ebe4f8; --z-emp-ink: #6541ad;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #161d27; --ink: #e3e8ef; --muted: #96a3b4; --line: #2a3442;
  --orig: #3cc3b2; --orig-soft: #12302e; --enc: #f0a04b; --enc-soft: #3a2914;
  --bad: #ef6e6e; --bad-soft: #3b1b1d;
  --cmd-bg: #0a0e13; --cmd-ink: #e6ecf2; --cmd-prompt: #f0a04b; --cmd-muted: #7f8c9c;
  --z-casa: #15223a; --z-casa-ink: #8fb4f2; --z-net: #1b222d; --z-net-ink: #a3afbf; --z-emp: #221a36; --z-emp-ink: #bba3f0;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --ink: #e3e8ef; --muted: #96a3b4; --line: #2a3442;
  --orig: #3cc3b2; --orig-soft: #12302e; --enc: #f0a04b; --enc-soft: #3a2914;
  --bad: #ef6e6e; --bad-soft: #3b1b1d;
  --cmd-bg: #0a0e13; --cmd-ink: #e6ecf2; --cmd-prompt: #f0a04b; --cmd-muted: #7f8c9c;
  --z-casa: #15223a; --z-casa-ink: #8fb4f2; --z-net: #1b222d; --z-net-ink: #a3afbf; --z-emp: #221a36; --z-emp-ink: #bba3f0;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5 }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px }

.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between }
.brand { font-weight: 700; font-size: 1.05rem }
.brand span { color: var(--muted); font-weight: 400 }
.steps { display: flex; gap: 6px; flex-wrap: wrap }
.steps button { font: inherit; font-size: 0.88rem; cursor: pointer; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; display: flex; gap: 8px; align-items: center }
.steps .n { font-family: var(--mono); font-weight: 600 }
.steps button[aria-current="step"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
button:focus-visible { outline: 2px solid var(--enc); outline-offset: 2px }

.head { display: grid; gap: 6px }
.head h1 { margin: 0; font-size: clamp(1.5rem, 3.2vw, 2.1rem); line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance }
.head p { margin: 0; font-size: 1.05rem; color: var(--muted); max-width: 76ch }
.where { justify-self: start; font-family: var(--mono); font-size: 0.78rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--z-casa-ink); color: var(--z-casa-ink); background: var(--z-casa) }

.cmds { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.cmds .lbl { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px }
.cmd { font-family: var(--mono); font-size: 0.86rem; background: var(--cmd-bg); color: var(--cmd-ink); padding: 6px 12px; border-radius: 7px; white-space: nowrap; max-width: 100%; overflow-x: auto }
.cmd::before { content: "$ "; color: var(--cmd-prompt) }
.cmd .c { color: var(--cmd-muted) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 }

.topo { overflow-x: auto }
.topo svg { display: block; width: 100%; min-width: 640px; height: auto }
.topo text { font-family: var(--mono); fill: var(--ink) }
.topo .lbl { font-size: 13px; font-weight: 600; font-family: var(--sans) }
.topo .ip { font-size: 11px; fill: var(--muted) }
.topo .z-casa { fill: var(--z-casa); stroke: var(--z-casa-ink); stroke-opacity: .45 }
.topo .z-net  { fill: var(--z-net);  stroke: var(--z-net-ink);  stroke-opacity: .45; stroke-dasharray: 5 4 }
.topo .z-emp  { fill: var(--z-emp);  stroke: var(--z-emp-ink);  stroke-opacity: .45 }
.topo .zt { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: .08em }
.topo .zt-casa { fill: var(--z-casa-ink) } .topo .zt-net { fill: var(--z-net-ink) } .topo .zt-emp { fill: var(--z-emp-ink) }
.topo .zs { font-size: 10.5px; fill: var(--muted) }
.topo .tlbl { font-size: 11px; fill: var(--enc); font-weight: 600 }
.topo .fail { font-size: 11px; fill: var(--bad); font-weight: 600 }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.82rem; color: var(--muted); margin-top: 6px }
.legend span::before { content: ""; display: inline-block; width: 20px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--c) }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr } }

.result { display: grid; gap: 12px }
.big { font-size: 1.4rem; font-weight: 700; line-height: 1.25; text-wrap: balance }
.big.ok { color: var(--orig) } .big.bad { color: var(--bad) } .big.enc { color: var(--enc) }
.big .ipv { font-family: var(--mono); font-weight: 600 }
.route { display: grid; gap: 2px }
.route code { font-family: var(--mono); font-size: 0.88rem; padding: 6px 10px; border-radius: 6px; background: var(--bg); border-left: 3px solid var(--rc, var(--muted)); overflow-x: auto; white-space: nowrap }
.why { margin: 0 }
.key { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-weight: 500 }
.key b { font-family: var(--mono); font-size: 0.72rem; letter-spacing: .08em; color: var(--muted); display: block; font-weight: 600 }

.fig { display: grid; gap: 10px }
.view { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line) }
.view.enc { border-color: var(--enc); background: var(--enc-soft) }
.view.bad { border-color: var(--bad); background: var(--bad-soft) }
.view.ok  { border-color: var(--orig); background: var(--orig-soft) }
.view .who { font-size: 0.76rem; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.view .cap2 { font-family: var(--mono); font-size: 0.8rem; overflow-wrap: anywhere }

.pkt { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--mono); font-size: 0.76rem }
.h { padding: 5px 8px; border-radius: 5px; border: 1px solid; display: grid; background: var(--surface) }
.h b { font-size: 0.66rem; letter-spacing: 0.06em; font-weight: 600; opacity: .8 }
.h.o { border-color: var(--orig) }
.h.e { border-color: var(--enc) }
.h .secret { color: var(--bad); font-weight: 600 }
.box { flex: 1 1 220px; border: 1px dashed var(--enc); border-radius: 6px; padding: 6px 8px; display: grid; gap: 4px;
  background: repeating-linear-gradient(135deg, var(--enc-soft) 0 6px, transparent 6px 12px) }
.box .cap { font-size: 0.7rem; color: var(--enc); font-weight: 600 }
.box.sealed .pkt { opacity: .45; filter: blur(1.5px) }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); justify-self: start }
.seg button { font: inherit; font-size: 0.9rem; cursor: pointer; color: var(--ink); background: transparent; border: 0; padding: 7px 14px }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600 }

.nav { display: flex; justify-content: space-between; gap: 8px }
.nav button { font: inherit; font-size: 0.92rem; cursor: pointer; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px }
.nav button:disabled { opacity: .35; cursor: default }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">Laboratório VPN</div>
    <nav class="steps" aria-label="Passos">
      <button id="st-0" data-step="0"><span class="n">1</span>Sem VPN</button>
      <button id="st-1" data-step="1"><span class="n">2</span>Com VPN</button>
      <button id="st-2" data-step="2"><span class="n">3</span>Quem vê o quê</button>
      <button id="st-3" data-step="3"><span class="n">4</span>Split x full</button>
    </nav>
  </div>

  <div class="head" aria-live="polite">
    <h1 id="title"></h1>
    <p id="lead"></p>
    <span class="where" id="where"></span>
  </div>

  <div class="cmds" id="cmds"></div>

  <section class="card topo" aria-label="Topologia">
    <svg id="svg" viewBox="0 0 920 270" role="img" aria-label="Funcionário, Internet com o provedor e um site público, e a empresa com o gateway VPN e o servidor interno">
      <defs>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="8" height="8" fill="var(--enc-soft)"/><line x1="0" y1="0" x2="0" y2="8" stroke="var(--enc)" stroke-opacity=".25" stroke-width="3"/>
        </pattern>
      </defs>
      <rect class="z-casa" x="8" y="8" width="168" height="254" rx="12"/>
      <text class="zt zt-casa" x="22" y="32">FUNCIONÁRIO</text>
      <text class="zs" x="22" y="48">em casa</text>
      <rect class="z-net" x="188" y="8" width="388" height="254" rx="12"/>
      <text class="zt zt-net" x="202" y="32">INTERNET</text>
      <text class="zs" x="202" y="48">endereços públicos</text>
      <rect class="z-emp" x="588" y="8" width="324" height="254" rx="12"/>
      <text class="zt zt-emp" x="602" y="32">EMPRESA</text>
      <text class="zs" x="602" y="48">rede privada 10.10.0.0/24</text>
      <g stroke="var(--line)" stroke-width="3" fill="none">
        <line x1="82" y1="100" x2="675" y2="100"/>
        <line x1="675" y1="100" x2="850" y2="100"/>
        <line x1="420" y1="100" x2="420" y2="210"/>
      </g>
      <rect id="tunnel" x="82" y="86" width="593" height="28" rx="14" fill="url(#hatch)" stroke="var(--enc)" stroke-dasharray="6 4" opacity="0"/>
      <text id="tunnelLbl" class="tlbl" x="330" y="78" opacity="0">túnel WireGuard · UDP 51820</text>
      <g id="path"></g>
      <g id="fail"></g>
      <circle id="dot" r="8" cx="-20" cy="-20" stroke="var(--surface)" stroke-width="2"/>
      <g id="nodes"></g>
    </svg>
    <div class="legend">
      <span style="--c: var(--orig)">pacote original</span>
      <span style="--c: var(--enc)">pacote dentro do túnel (cifrado)</span>
    </div>
  </section>

  <div class="cols">
    <section class="card result">
      <p class="label">Resultado</p>
      <div class="seg" id="sub" role="group" aria-label="Tipo de túnel">
        <button id="sub-split" data-sub="split">Split tunnel</button>
        <button id="sub-full" data-sub="full">Full tunnel</button>
      </div>
      <div class="big" id="big"></div>
      <div class="route" id="route"></div>
      <p class="why" id="why"></p>
      <p class="key" id="key"></p>
    </section>
    <section class="card fig">
      <p class="label" id="figLabel">O pacote</p>
      <div id="fig" class="fig"></div>
    </section>
  </div>

  <div class="nav">
    <button id="prev">← Anterior</button>
    <button id="next">Próximo →</button>
  </div>
</div>

<script>
(() => {
  const SECRET = "usuario=ana&senha=1234";
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const SEC = s => esc(s).replace(esc(SECRET), `<span class="secret">${esc(SECRET)}</span>`);

  const orig = (src, dst, http) =>
    `<div class="pkt"><span class="h o"><b>IP</b>${src} → ${dst}</span><span class="h o"><b>TCP</b>80</span><span class="h o"><b>HTTP</b>${SEC(http)}</span></div>`;
  const enc = (outerSrc, inner, sealed) =>
    `<div class="pkt"><span class="h e"><b>IP EXTERNO</b>${outerSrc} → 198.51.100.2</span><span class="h e"><b>UDP</b>51820</span>
     <div class="box${sealed ? " sealed" : ""}"><span class="cap">${sealed ? "cifrado: ilegível para a Internet" : "pacote original, cifrado"}</span>${inner}</div></div>`;
  const view = (cls, who, body, cap) => `<div class="view ${cls}"><span class="who">${who}</span>${body}${cap ? `<span class="cap2">${cap}</span>` : ""}</div>`;

  const NOTE = { name: "seu notebook", ip: ["Wi-Fi 192.168.18.107", "lab 203.0.113.1", "wg-lab 10.8.0.2"], tag: "PC" };
  const CONT = { name: "funcionario", ip: ["container 203.0.113.10", "wg0 10.8.0.2"], tag: "PC" };

  const STEPS = [
    {
      title: "Sem VPN, o servidor não responde",
      lead: "Tudo vai para o provedor, e ele não conhece 10.10.0.20.",
      where: "no seu notebook", F: NOTE,
      cmds: ["ip route get 10.10.0.20", "curl -m 3 http://10.10.0.20/"],
      mode: "off", segs: [["F", "R", "o"]], fail: "R",
      bigCls: "bad", bigTxt: "Timeout",
      route: ["10.10.0.20 via 192.168.18.1 dev wlp0s20f3", "var(--bad)", "rota padrão (Wi-Fi)"],
      why: "",
      key: "Endereço privado não é roteado na Internet.",
      figLabel: "O pacote",
      fig: () => view("bad", "Descartado no provedor", orig("192.168.18.107", "10.10.0.20", "GET /")),
    },
    {
      title: "Com VPN, o pacote vai pelo túnel",
      lead: "Surge a interface wg-lab e uma rota para a rede da empresa.",
      where: "no seu notebook", F: NOTE,
      cmds: ["vpn.sh split", "ip route get 10.10.0.20", "curl http://10.10.0.20/"],
      mode: "split", segs: [["F", "G", "e"], ["G", "S", "o"]],
      bigCls: "ok", bigTxt: `O servidor responde e vê <span class="ipv">10.8.0.2</span>`,
      route: ["10.10.0.20 dev wg-lab src 10.8.0.2", "var(--enc)", "rota nova (túnel)"],
      why: "10.8.0.2 é o endereço do notebook dentro do túnel.",
      key: "A VPN só acrescenta uma interface e uma rota.",
      figLabel: "Encapsulamento",
      fig: () => view("enc", "Na Internet", enc("203.0.113.1", orig("10.8.0.2", "10.10.0.20", "GET /"), false))
               + view("ok", "Depois do gateway", orig("10.8.0.2", "10.10.0.20", "GET /")),
    },
    {
      title: "A Internet vê o envelope, a empresa vê o conteúdo",
      lead: "Um login por HTTP, capturado em dois pontos.",
      where: "no seu notebook + duas capturas", F: NOTE,
      cmds: ["./lab.sh provedor <span class=\"c\"># outro terminal</span>", "./lab.sh empresa <span class=\"c\"># outro terminal</span>", `curl -d '${SECRET}' http://10.10.0.20/login`],
      mode: "split", segs: [["F", "G", "e"], ["G", "S", "o"]],
      bigCls: "enc", bigTxt: "A proteção termina no gateway",
      route: null,
      why: "",
      key: "VPN protege até a empresa. HTTPS protege até o servidor.",
      figLabel: "O que cada captura mostra",
      fig: () => view("enc", "No provedor", enc("203.0.113.1", orig("10.8.0.2", "10.10.0.20", "POST /login " + SECRET), true))
               + view("bad", "Dentro da empresa", orig("10.8.0.2", "10.10.0.20", "POST /login " + SECRET)),
    },
    { split: true },
  ];
  const STEP4 = {
    split: {
      title: "Split: só a empresa vai pelo túnel",
      lead: "O resto sai direto.",
      where: "no seu notebook", F: NOTE,
      cmds: ["curl http://198.51.100.100/"],
      mode: "split", segs: [["F", "J", "o"], ["J", "W", "o"]],
      bigCls: "ok", bigTxt: `O site vê <span class="ipv">203.0.113.1</span>`,
      route: ["198.51.100.100 via 203.0.113.254", "var(--orig)", "fora do túnel"],
      why: "É o IP de casa.",
      key: "Quem decide o que entra no túnel é a rota.",
      figLabel: "O pacote",
      fig: () => view("ok", "Direto para o site", orig("203.0.113.1", "198.51.100.100", "GET /")),
    },
    full: {
      title: "Full: tudo vai pelo túnel",
      lead: "Feito no container, para não desviar a internet real do notebook.",
      where: "no container funcionario", F: CONT,
      cmds: ["vpn.sh off", "./lab.sh shell", "vpn.sh full", "curl http://198.51.100.100/"],
      mode: "full", segs: [["F", "G", "e"], ["G", "J", "o"], ["J", "W", "o"]],
      bigCls: "enc", bigTxt: `O site vê <span class="ipv">198.51.100.2</span>`,
      route: ["198.51.100.100 dev wg0 src 10.8.0.2", "var(--enc)", "entra no túnel"],
      why: "É o IP da empresa: o gateway faz NAT.",
      key: "É assim que funcionam as VPNs comerciais.",
      figLabel: "O pacote",
      fig: () => view("enc", "Até a empresa", enc("203.0.113.10", orig("10.8.0.2", "198.51.100.100", "GET /"), false))
               + view("ok", "Depois do gateway (NAT)", orig("198.51.100.2", "198.51.100.100", "GET /")),
    },
  };

  // ---------- topologia ----------
  const N = {
    F: { x: 82,  y: 100 },
    R: { x: 300, y: 100, tag: "R",   name: "provedor", ip: [] },
    J: { x: 420, y: 100 },
    G: { x: 675, y: 100, tag: "VPN", name: "gateway-vpn", ip: ["198.51.100.2 (pública)", "10.10.0.1 (interna)"] },
    S: { x: 850, y: 100, tag: "SRV", name: "servidor-interno", ip: ["10.10.0.20"] },
    W: { x: 420, y: 210, tag: "WEB", name: "site-publico", ip: ["198.51.100.100"] },
  };
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
  const nodesG = document.getElementById("nodes");
  function drawNodes(F) {
    nodesG.innerHTML = "";
    Object.assign(N.F, F);
    for (const k of ["F", "R", "G", "S", "W"]) {
      const n = N[k], g = el("g", {}, nodesG);
      el("rect", { x: n.x - 18, y: n.y - 16, width: 36, height: 32, rx: 6, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 1.5 }, g);
      el("text", { x: n.x, y: n.y + 5, "text-anchor": "middle", "font-size": 12, "font-weight": 600 }, g).textContent = n.tag;
      const side = k === "W";
      const lx = side ? n.x + 28 : n.x, ly = side ? n.y + 5 : n.y + 36, a = side ? "start" : "middle";
      el("text", { x: lx, y: ly, "text-anchor": a, class: "lbl" }, g).textContent = n.name;
      n.ip.forEach((ip, i) => el("text", { x: lx, y: ly + 15 + i * 14, "text-anchor": a, class: "ip" }, g).textContent = ip);
    }
  }
  const pathG = document.getElementById("path"), failG = document.getElementById("fail"), dot = document.getElementById("dot");
  const color = k => k === "e" ? "var(--enc)" : "var(--orig)";
  let raf = 0;
  function draw(sc) {
    drawNodes(sc.F);
    pathG.innerHTML = ""; failG.innerHTML = "";
    const on = sc.mode !== "off";
    document.getElementById("tunnel").setAttribute("opacity", on ? 1 : 0);
    document.getElementById("tunnelLbl").setAttribute("opacity", on ? 1 : 0);
    const segs = sc.segs.map(([a, b, k]) => ({ a: N[a], b: N[b], k, len: Math.hypot(N[b].x - N[a].x, N[b].y - N[a].y) }));
    segs.forEach(s => el("line", { x1: s.a.x, y1: s.a.y, x2: s.b.x, y2: s.b.y, stroke: color(s.k), "stroke-width": 5, "stroke-linecap": "round", opacity: .85 }, pathG));
    if (sc.fail) {
      const n = N[sc.fail];
      el("path", { d: `M${n.x + 26} ${n.y - 34} l16 16 m0 -16 l-16 16`, stroke: "var(--bad)", "stroke-width": 4, "stroke-linecap": "round" }, failG);
      el("text", { x: n.x + 48, y: n.y - 21, class: "fail" }, failG).textContent = "sem rota para 10.10.0.20";
    }
    cancelAnimationFrame(raf);
    const total = segs.reduce((t, s) => t + s.len, 0);
    const place = d => { for (const s of segs) { if (d <= s.len) { const t = d / s.len; dot.setAttribute("cx", s.a.x + (s.b.x - s.a.x) * t); dot.setAttribute("cy", s.a.y + (s.b.y - s.a.y) * t); dot.setAttribute("fill", color(s.k)); return; } d -= s.len; } };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { place(total); return; }
    const dur = 600 + total * 3, t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / dur); place(total * (1 - Math.pow(1 - p, 2))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  }

  // ---------- render ----------
  const state = { step: 0, sub: "split" };
  const $ = id => document.getElementById(id);
  function render() {
    const sc = STEPS[state.step].split ? STEP4[state.sub] : STEPS[state.step];
    document.querySelectorAll("[data-step]").forEach(b => {
      if (+b.dataset.step === state.step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("title").textContent = sc.title;
    $("lead").textContent = sc.lead;
    $("where").textContent = sc.where;
    $("where").style.cssText = sc.F === CONT ? "border-color: var(--muted); color: var(--muted); background: var(--surface)" : "";
    $("cmds").innerHTML = `<span class="lbl">Comandos</span>` + sc.cmds.map(c => `<span class="cmd">${c.includes("<span") ? c : esc(c)}</span>`).join("");
    $("big").className = "big " + sc.bigCls;
    $("big").innerHTML = sc.bigTxt;
    $("route").innerHTML = sc.route ? `<span class="label">Rota escolhida · ${sc.route[2]}</span><code style="--rc: ${sc.route[1]}">${sc.route[0]}</code>` : "";
    $("why").textContent = sc.why; $("why").hidden = !sc.why;
    $("key").innerHTML = `<b>IDEIA-CHAVE</b>${sc.key}`;
    $("figLabel").textContent = sc.figLabel;
    $("fig").innerHTML = sc.fig();
    const last = state.step === 3;
    $("sub").hidden = !last;
    document.querySelectorAll("[data-sub]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sub === state.sub));
    $("prev").disabled = state.step === 0;
    $("next").disabled = last && state.sub === "full";
    draw(sc);
  }
  const go = i => { state.step = Math.max(0, Math.min(3, i)); state.sub = "split"; render(); };
  const next = () => { if (state.step === 3) { if (state.sub === "split") { state.sub = "full"; render(); } } else go(state.step + 1); };
  const prev = () => { if (state.step === 3 && state.sub === "full") { state.sub = "split"; render(); } else go(state.step - 1); };
  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => go(+b.dataset.step)));
  document.querySelectorAll("[data-sub]").forEach(b => b.addEventListener("click", () => { state.sub = b.dataset.sub; render(); }));
  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  });
  render();
})();
</script>
</body>
</html>
